# Local lit configuration for compiler/test/CodeGen/VC4.
#
# The CodeGen/VC4/Emit tests invoke vc4-codegen by bare executable name.
# Keep this file tiny and only prepend known tool directories; do not replace
# the PATH assembled by the top-level lit configuration.

import os


def _prepend_path_if_dir(directory):
    if not directory:
        return
    directory = os.path.abspath(str(directory))
    if not os.path.isdir(directory):
        return
    current_path = config.environment.get("PATH", "")
    parts = [part for part in current_path.split(os.pathsep) if part]
    if directory in parts:
        return
    config.environment["PATH"] = (
        directory + (os.pathsep + current_path if current_path else "")
    )


_tool_dirs = []

# Preferred: project-specific tool dir exported by lit.site.cfg.py.
_vc4_tools_dir = getattr(config, "vc4_tools_dir", None)
if _vc4_tools_dir:
    _tool_dirs.append(_vc4_tools_dir)

# Common fallback: <compiler-build>/bin from a configured obj root.
_vc4_obj_root = getattr(config, "vc4_obj_root", None)
if _vc4_obj_root:
    _tool_dirs.append(os.path.join(_vc4_obj_root, "bin"))

# Common fallback in this repo: test_exec_root is <compiler-build>/test.
_test_exec_root = getattr(config, "test_exec_root", None)
if _test_exec_root:
    _tool_dirs.append(os.path.join(os.path.dirname(_test_exec_root), "bin"))

# Source-root fallbacks for the default compiler/build tree.
_vc4_src_root = getattr(config, "vc4_src_root", None)
if _vc4_src_root:
    _tool_dirs.append(os.path.join(_vc4_src_root, "build", "bin"))

_test_source_root = getattr(config, "test_source_root", None)
if _test_source_root:
    _tool_dirs.append(os.path.join(_test_source_root, "..", "build", "bin"))

# Preserve LLVM/MLIR tool dirs if the top-level config exposes them here too.
for _attr in ("llvm_tools_dir", "mlir_tools_dir"):
    _value = getattr(config, _attr, None)
    if _value:
        _tool_dirs.append(_value)

for _directory in _tool_dirs:
    _prepend_path_if_dir(_directory)
